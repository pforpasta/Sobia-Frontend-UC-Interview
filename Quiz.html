<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Schoolbell&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
 <body>
  <div class="container">

      <div class="progressBarContainer hide" id="progressBar"><div class="progressBar smooth"></div></div>

      <img src="images/friends-logo.png" class="friends-logo" id="removeafter">
      <img src="images/landing-image.jpg" class="landing-image" id="removeafterimg">

      <div id="question-container" class="hide">
        <div id="question" class="question-text">Question</div>
        <div id="answer-buttons" class="btn-grid">
          <button class="btn">Answer 1</button>
          <button class="btn">Answer 2</button>
          <button class="btn">Answer 3</button>
          <button class="btn">Answer 4</button>
        </div>
      </div>

      <div class="controls">
        <p class="the-end hide smooth" id="theend">
          <span class="span-text">The friends quiz has ended</span>
          <img src="images/landing-image.jpg" class="landing-image smooth">
        </p>
        <button id="start-btn" class="start-btn btn">Start</button>
        <button id="next-btn" class="next-btn btn hide">Next</button>
      </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
