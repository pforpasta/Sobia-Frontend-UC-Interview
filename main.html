<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styletask3.css">
</head>
<body>
  <div class="container">

    <div class="search-div">
      <input type="text" class="search-bar" placeholder="Search" id="search-bar">
      <button class="search-button" id="search-button">S</button>
    </div>
    
    <div class="episode-title-details">
      <div class="episode-header">
        <div class="episode-name" id="episode-name">Episode Name</div>
        <div class="episode-number">S0<span id="episode-season">1</span>E0<span id="episode-number">1</span></div>
      </div>

      <div class="episode-details">
        <div class="episode-runtime" id="episode-runtime">00</div>
        <div class="episode-airdate" id="episode-airdate">0000-00-00</div>
      </div>
    </div>
    
    <div class="episode-info-details">
      <div class="episode-image">
        <img src="https://static.tvmaze.com/uploads/images/medium_landscape/229/572688.jpg" class="episode-img" id="episode-image">
      </div>

      <div class="episode-summary" id="episode-summary">Episode Summary</div>
    </div>
    
  </div>
  <script src="scripttask3.js"></script>
</body>
</html>
