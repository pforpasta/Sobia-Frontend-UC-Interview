<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/signup.css">
</head>
<body>
    <div class="signup-background">
      <img src="images/signup-background-image.jpg" class="signup-background-image">
    </div>

    <div class="right-section">
      <div class="right-section-header">
        Central Perk Cafe
      </div>

      <div class="right-section-subheader">
        <div class="subheader-1">
          Create Your Account
        </div>
        <div class="subheader-2">
          Join our digital living room for the finest brews and cozy moments.
        </div>
      </div>

      <div class="right-section-details">
        <div class="box-header">Full Name</div>
        <input type="text" placeholder="Phoebe Buffay" class="fullname-input-box">

        <div class="box-header">Email Address</div>
        <input type="text" placeholder="smellycat@centralperk.com" class="email-input-box">

        <div class="password-section">
          <div>
            <div class="box-header">Password</div>
            <input type="password" placeholder="••••••••" class="password-input-box">
          </div>

          <div>
            <div class="box-header">Confirm Password</div>
            <input type="password" placeholder="••••••••" class="confirm-password-input-box">
          </div>
        </div>

        <div class="terms-section">
          <input type="checkbox" class="checkbox-box"> I agree to the <span class="terms-span">Terms of Service</span>
        </div>

        <div>
          <button class="signup-button"> Sign Up</button>
        </div>

        <div class="login-text">
          Already have an account? <span class="login">Login</span>
        </div>

        <div class="horizontal-line"></div>

        <div class="other-links">
          <p class="space-other-links">Privacy Policy</p>
          <p class="space-other-links">Terms of Service</p>
          <p >Accessibility</p>
        </div>
      </div>
    </div>
</body>
</html>
